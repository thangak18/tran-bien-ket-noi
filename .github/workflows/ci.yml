name: CI Pipeline

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Verify & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: tranbien
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Run Lint & Prettier
        working-directory: ./app
        run: npm run lint

      - name: Run TypeScript Check
        working-directory: ./app
        run: npx tsc --noEmit

      - name: Run Migrations & Seed Database
        working-directory: ./app
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tranbien
          DATABASE_URL_DIRECT: postgresql://postgres:postgrespassword@localhost:5432/tranbien
          CITIZEN_JWT_SECRET: tran-bien-ci-jwt-secret-at-least-32-chars-long
          OWNER_KEY_PEPPER: tran-bien-ci-owner-pepper
          CRON_SECRET: tran-bien-ci-cron-secret
          DEMO_MODE: 'true'
        run: |
          npx drizzle-kit push
          npm run seed

      - name: Run Database Invariant Verification (db:verify)
        working-directory: ./app
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tranbien
          DATABASE_URL_DIRECT: postgresql://postgres:postgrespassword@localhost:5432/tranbien
        run: npm run db:verify

      - name: Run Unit & Component Tests
        working-directory: ./app
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/tranbien
          CITIZEN_JWT_SECRET: tran-bien-ci-jwt-secret-at-least-32-chars-long
          OWNER_KEY_PEPPER: tran-bien-ci-owner-pepper
          CRON_SECRET: tran-bien-ci-cron-secret
          DEMO_MODE: 'true'
        run: npm run test

      - name: Run Mock Data Verification (mock:verify)
        working-directory: ./app
        run: npm run mock:verify

      - name: Build Production Frontend
        working-directory: ./app
        run: npm run build
