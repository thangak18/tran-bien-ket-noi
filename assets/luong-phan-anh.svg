or='middle' font-size='16' font-weight='700' fill='#111827' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>7. Người dân xem kết quả</text><text x='450.0' y='311.0' text-anchor='middle' font-size='13' fill='#4B5563' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>ảnh Trước / Sau</text><line x1='1020' y1='170' x2='1020' y2='248' stroke='#6B7280' stroke-width='2' marker-end='url(#a)' stroke-dasharray='6 5'/><text x='1030' y='214' font-size='12' fill='#6B7280' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>nếu cần</text><line x1='895' y1='170' x2='800' y2='248' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><line x1='895' y1='295' x2='862' y2='295' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><line x1='610' y1='295' x2='577' y2='295' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><rect x='40' y='400' width='300' height='80' rx='14' fill='#DCFCE7' stroke='#16A34A' stroke-width='2'/><text x='190.0' y='434.0' text-anchor='middle' font-size='16' font-weight='700' fill='#111827' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>Hài lòng → đánh giá</text><text x='190.0' y='456.0' text-anchor='middle' font-size='13' fill='#4B5563' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>hồ sơ đóng</text><rect x='380' y='400' width='360' height='80' rx='14' fill='#FEF3C7' stroke='#D97706' stroke-width='2'/><text x='560.0' y='434.0' text-anchor='middle' font-size='16' font-weight='700' fill='#111827' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>"Chưa giải quyết" → mở lại</text><text x='560.0' y='456.0' text-anchor='middle' font-size='13' fill='#4B5563' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>tạo nhiệm vụ kiểm tra lại, không báo mới</text><line x1='400' y1='340' x2='220' y2='398' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><line x1='470' y1='340' x2='540' y2='398' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><path d='M740,440 C900,440 1020,420 1020,342' fill