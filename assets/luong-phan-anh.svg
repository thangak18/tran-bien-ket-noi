<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 520' width='1200' height='520'><defs><marker id='a' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6B7280'/></marker></defs><rect width='1200' height='520' fill='#F5F7FB'/><text x='40' y='44' font-size='22' font-weight='700' fill='#111827' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>Hành trình của một phản ánh</text><rect x='40' y='80' width='250' height='90' rx='14' fill='#EFF4FF' stroke='#2563EB' stroke-width='2'/><text x='165.0' y='119.0' text-anchor='middle' font-size='16' font-weight='700' fill='#111827' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>1. Phát hiện sự cố</text><text x='165.0' y='141.0' text-anchor='middle' font-size='13' fill='#4B5563' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>ổ gà, đèn, ngập, rác</text><line x1='290' y1='125' x2='323' y2='125' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><rect x='325' y='80' width='250' height='90' rx='14' fill='#EFF4FF' stroke='#2563EB' stroke-width='2'/><text x='450.0' y='119.0' text-anchor='middle' font-size='16' font-weight='700' fill='#111827' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>2. Gửi phản ánh</text><text x='450.0' y='141.0' text-anchor='middle' font-size='13' fill='#4B5563' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>ảnh → vị trí → loại</text><line x1='575' y1='125' x2='608' y2='125' stroke='#6B7280' stroke-width='2' marker-end='url(#a)'/><rect x='610' y='80' width='250' height='90' rx='14' fill='#EFF4FF' stroke='#2563EB' stroke-width='2'/><text x='735.0' y='119.0' text-anchor='middle' font-size='16' font-weight='700' fill='#111827' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>3. Chọn cách theo dõi</text><text x='735.0' y='141.0' text-anchor='middle' font-size='13' fill='#4B5563' font-family='Be Vietnam Pro, Segoe UI, Arial, sans-serif'>SĐT + OTP mô phỏng / ẩn danh</text><line x1='860' y1='125'